version: '3.9'

services:
  # ========================================================================
  # DATABASE - PostgreSQL with TimescaleDB
  # ========================================================================
  postgres:
    image: timescaledb/timescaledb:latest-pg15
    container_name: options-trading-postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_DB: options_trading
      TIMESCALEDB_TELEMETRY: off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d options_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network
    restart: unless-stopped

  # ========================================================================
  # CACHE - Redis
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: options-trading-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network
    restart: unless-stopped

  # ========================================================================
  # BACKEND - FastAPI Application
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: options-trading-backend
    environment:
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Safety
      PAPER_TRADING: ${PAPER_TRADING:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-options_trading}
      DB_USER: ${DB_USER:-trader}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      DB_POOL_SIZE: 10

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4

      # Market Data
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-simulator}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE:-Asia/Kolkata}

      # Trading Config
      MAX_ACCOUNT_RISK_PER_TRADE: ${MAX_ACCOUNT_RISK_PER_TRADE:-0.01}
      MAX_DAILY_LOSS_PERCENT: ${MAX_DAILY_LOSS_PERCENT:-0.02}

      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://frontend:3000"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs

    networks:
      - trading-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    # Keep container running even if errors
    stdin_open: true
    tty: true

  # ========================================================================
  # MONITORING - Prometheus
  # ========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: options-trading-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - trading-network
    restart: unless-stopped
    depends_on:
      - backend

  # ========================================================================
  # VISUALIZATION - Grafana
  # ========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: options-trading-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - trading-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ========================================================================
  # FRONTEND - React Dashboard (Optional)
  # ========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: options-trading-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trading-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
